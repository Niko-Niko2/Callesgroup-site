<!--meta {"title": "Get a Free Website Quote | Elgin, IL | Calles Group",
 "description": "Get a free quote for a website, Brand Kit or care plan in Elgin, IL. Tap a few answers or book a free call. Replies within 24 hours. Call or text 312-600-0590.",
 "nav": "contact", "crumb": "Contact"} -->

<section class="ct" aria-label="Get a free quote"><div class="wrap ct-grid">
  <div class="ct-intro">
    <p class="eyebrow">Free quote</p>
    <h1>Let's talk about <em>your business.</em></h1>
    <p class="need-line" id="needLine" hidden></p>
    <ol class="trust">
      <li><span class="num">1</span>Tap a few answers</li>
      <li><span class="num">2</span>Get a plan and a price</li>
      <li><span class="num">3</span>You decide, no pressure</li>
    </ol>
    <p class="fast"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="12"/><path d="M16 9v7l5 3"/></svg><span><b>Replies within 24 hours.</b> From Andrew, not a bot.</span></p>
  </div>

  <div class="ct-main">
    <span id="book"></span><span id="details"></span>
    <div class="switch-row">
      <div class="seg seg-wide" data-switch="mode" role="group" aria-label="How do you want to start?">
        <button type="button" data-value="book" data-hash="book" aria-pressed="false">Book a call</button>
        <button type="button" data-value="details" data-hash="details" aria-pressed="true">Send your details</button>
      </div>
    </div>

    <div class="mode" data-mode-show="book" data-pre-hide>
      <!-- BOOKING: shows the Wix Bookings widget when "bookingLive" is true in data/offers.json, otherwise the placeholder. -->
      {{booking}}
    </div>

    <div class="mode" data-mode-show="details">
      <h2 class="sr">Quote request form</h2>
      <div class="card form-card" id="formCard">
        <div class="ct-bar" aria-hidden="true"><i id="ctBar"></i></div>
        <!-- QUOTE FORM MOUNT: js/quote-form.js builds the form here. -->
        <div id="quote"></div>
        <noscript><p>The quote form needs JavaScript. Call or text {{phone}}, or email {{email}}, and Andrew will reply {{reply}}.</p></noscript>
      </div>
      <p class="small muted ct-fine">See our <a href="/privacy-policy.html">privacy policy</a>.</p>
    </div>

    <div class="other-ways">
      <h2 class="h3">Rather talk now?</h2>
      {{ways}}
    </div>
  </div>
</div></section>

<script>
// ?need=<key> from package, bundle and care plan buttons. Built from data/offers.json.
(function () {
  var NEEDS = {{needs}};
  var need = window.CG_NEED = NEEDS[new URLSearchParams(location.search).get("need")];
  if (need && need.label) { var l = document.getElementById("needLine"); l.textContent = "You're asking about " + need.label + ". You can change it in the form."; l.hidden = false; }
})();
</script>
<script type="module">
// Quote form (js/quote-form.js). Leads are emailed to Andrew through Web3Forms.
import { renderQuoteForm } from "/js/quote-form.js";
const bar = document.getElementById("ctBar"), card = document.getElementById("formCard");
const calm = matchMedia("(prefers-reduced-motion: reduce)");
let last = 0;
renderQuoteForm(document.querySelector("#quote"), {
  need: window.CG_NEED,
  onStep: (n, total, box) => {
    bar.style.width = Math.max(8, (n / (total + 1)) * 100) + "%";
    if (last) {
      box.classList.remove("enter"); void box.offsetWidth; box.classList.add("enter");
      if (card.getBoundingClientRect().top < 0) card.scrollIntoView({ block: "start", behavior: calm.matches ? "auto" : "smooth" });
    }
    last = n;
  },
  onDone: () => { bar.style.width = "100%"; setTimeout(() => location.assign("/thank-you.html"), 600); }
});
</script>
