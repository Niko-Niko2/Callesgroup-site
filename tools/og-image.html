<!doctype html><html><head><meta charset="utf-8">
<!-- Source for /og-image.png (1200x630), the picture shown when a link is shared.
     Render it with a headless browser at 1200x630 from the repo root (fonts load from /assets/fonts). -->
<style>
@font-face{font-family:"Big Shoulders Display";src:url(../assets/fonts/big-shoulders-display.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:"Libre Franklin";src:url(../assets/fonts/libre-franklin.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:"Covered By Your Grace";src:url(../assets/fonts/covered-by-your-grace.woff2) format("woff2")}
html,body{margin:0}
body{width:1200px;height:630px;box-sizing:border-box;padding:54px 64px 0;background:#FDFDFB;color:#0F1B4C;font-family:"Libre Franklin",sans-serif;display:flex;flex-direction:column;position:relative;overflow:hidden}
.top{display:flex;align-items:baseline;justify-content:space-between;border-bottom:4px solid #0A2A9E;padding-bottom:14px}
.brand{font:900 46px/1 "Big Shoulders Display";color:#0A2A9E;letter-spacing:.5px}
.brand i{font-style:normal;color:#D7261E}
.where{font-weight:700;font-size:24px;color:#0A2A9E}
h1{font:900 104px/.95 "Big Shoulders Display";color:#0A2A9E;margin:38px 0 0;max-width:1010px}
.row{display:flex;align-items:baseline;gap:22px;margin-top:30px;border-bottom:3px solid rgba(10,42,158,.3);padding-bottom:8px;width:760px}
.row b{font-size:24px;color:#0A2A9E;white-space:nowrap}
.row span{font:400 54px/1 "Covered By Your Grace";color:#2440C4}
.bot{margin:auto -64px 0;background:#FFE66B;border-top:4px dashed #0A2A9E;padding:22px 64px;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:28px}
.btn{background:#0A2A9E;color:#fff;padding:16px 28px;border-radius:8px;box-shadow:0 6px 0 #061E78}
</style></head><body>
<div class="top"><span class="brand">CALLES<i>.</i> GROUP</span><span class="where">Web design in Elgin, IL</span></div>
<h1>A website that gets you calls.</h1>
<div class="row"><b>Prepared for</b><span>your business</span></div>
<div class="bot"><span>Flat prices from $1,500. Hablamos español.</span><span class="btn">Book a free call</span></div>
</body></html>
