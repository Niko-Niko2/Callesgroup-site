<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:M;font-weight:600;src:url(https://cdn.jsdelivr.net/npm/@fontsource/montserrat@5.0.18/files/montserrat-latin-600-normal.woff2)}
@font-face{font-family:M;font-weight:700;src:url(https://cdn.jsdelivr.net/npm/@fontsource/montserrat@5.0.18/files/montserrat-latin-700-normal.woff2)}
html,body{margin:0}
body{width:1200px;height:630px;background:#151515;color:#EDEAE6;font-family:M;display:flex;flex-direction:column;justify-content:space-between;padding:72px 84px;box-sizing:border-box;position:relative;overflow:hidden}
body::after{content:"";position:absolute;right:-160px;top:-160px;width:620px;height:620px;border-radius:50%;border:2px solid #2E2C29;box-shadow:0 0 0 70px #191917,0 0 0 71px #2E2C29}
.top{display:flex;align-items:center;gap:22px;font-weight:700;font-size:34px;position:relative;z-index:1}
.b{width:74px;height:74px;border-radius:50%;border:3px solid #C9A962;color:#C9A962;display:grid;place-items:center;font-size:24px;letter-spacing:2px}
h1{font-size:70px;line-height:1.05;margin:0;font-weight:700;max-width:900px;letter-spacing:-1px;position:relative;z-index:1}
.e{white-space:nowrap;color:#C9A962;font-weight:700;font-size:22px;letter-spacing:4px;text-transform:uppercase;margin-bottom:22px}
.bot{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:26px;color:#A8A49E;position:relative;z-index:1}
.pill{background:#C9A962;color:#151515;padding:16px 30px;border-radius:14px;font-weight:700}
</style></head><body>
<div class="top"><span class="b">CG</span>Calles Group</div>
<div style="position:relative;z-index:1"><div class="e">Website design &amp; branding · Elgin, IL</div><h1>Look polished. Get found. Win more customers.</h1></div>
<div class="bot"><span>Websites from $1,500 · Serving Chicagoland</span><span class="pill">Get a free quote</span></div>
</body></html>
